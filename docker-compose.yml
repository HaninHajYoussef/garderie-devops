services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    networks: [garderie-net]
  frontend:
    build: ./frontend
    environment:
      - BACKEND_URL=http://backend:5000
    ports:
      - "3000:3000"
    depends_on: [backend]
    networks: [garderie-net]
networks:
  garderie-net:
    driver: bridge
