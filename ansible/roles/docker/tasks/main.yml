---
- name: Installer les prérequis
  apt:
    name: [ca-certificates, curl, gnupg]
    state: present
    update_cache: true

- name: Créer le dossier des clés APT
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Ajouter la clé GPG Docker
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Ajouter le dépôt Docker
  apt_repository:
    repo: "deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

- name: Installer Docker Engine et le plugin Compose
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Démarrer et activer Docker
  service:
    name: docker
    state: started
    enabled: true

- name: Autoriser l'utilisateur de déploiement à utiliser Docker
  user:
    name: "{{ docker_deploy_user }}"
    groups: docker
    append: true
